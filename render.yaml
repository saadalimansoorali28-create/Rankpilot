services:
  - type: web
    name: rankpilot-bilibili-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://rankpilot.eu.cc
